<div class="contacts-list">
    <h2>רשימת אנשי קשר</h2>
    @for(let contact of contactList; track contact){
    <div >
        <app-single-contact
            [contact]="contact"
            (editContact)="updateContact(contact.id)"
            (deleteContact)="deleteContact(contact.id)">
        </app-single-contact>
    </div>}
</div>
