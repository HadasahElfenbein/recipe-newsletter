<!-- contacts.html -->
<div class="container-fluid mt-4">
    <h2 class="mb-4 text-center">Contacts List</h2>
    <div class="mx-auto" style="width: 60%; min-width: 350px;">
        @for(contact of contactList; track contact){
        <div class="card shadow-sm p-3 mb-3 w-100">
            <app-single-contact
                [contact]="contact"
                (editContact)="updateContact(contact.id)"
                (deleteContact)="deleteContact(contact.id)">
            </app-single-contact>
        </div>
        }
        <button class="btn btn-primary w-100" style="margin-top: 15px; margin-bottom: 15px;" (click)="addContact()">Add Contact +</button>
    </div>
</div>
