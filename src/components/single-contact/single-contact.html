<!-- single-contact.html -->
<div class="single-contact">
    <h3>{{ contact.name }}</h3>
    <p>אימייל: {{ contact.email }}</p>
    
    <div class="button-group">
        <button class="btn btn-warning" (click)="editContact()">
            <i class="fas fa-pencil-alt"></i> עריכה
        </button>
        <button class="btn btn-danger" (click)="deleteContact()">
            <i class="fas fa-trash"></i> מחיקה
        </button>
    </div>
</div>
